<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden | EvidentX Security Enclave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl p-8 text-center space-y-6">
        <div class="w-16 h-16 mx-auto rounded-2xl bg-rose-950/80 border border-rose-500/30 flex items-center justify-center text-rose-400">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m0 0v2m0-2h2m-2 0H10m11.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
        </div>

        <div class="space-y-2">
            <span class="text-rose-500 font-mono text-xs font-bold uppercase tracking-wider block">Security Violation (HTTP 403)</span>
            <h1 class="text-2xl font-extrabold text-white tracking-tight">Access Prohibited</h1>
            <p class="text-xs text-slate-400" th:text="${errorMessage}">
                Your security role does not have authorization to access this forensic asset or docket.
            </p>
        </div>

        <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-[11px] text-slate-400 font-mono text-left">
            <div>Incident Logged: <span class="text-teal-400">ISO/IEC 27037 Audit Trail</span></div>
            <div>Action Taken: <span class="text-rose-400">Security Clearance Check Failed</span></div>
        </div>

        <div class="pt-2">
            <a href="/dashboard" class="inline-block w-full py-2.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-semibold text-xs tracking-wide shadow transition">
                Return to Security Dashboard
            </a>
        </div>
    </div>
</body>
</html>
