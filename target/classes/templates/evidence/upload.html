<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingest Evidence Item | EvidentX</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-100 min-h-screen">
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <a href="/dashboard" class="text-lg font-extrabold tracking-tight text-white flex items-center gap-1">
                Evident<span class="text-teal-400">X</span>
            </a>
            <div class="flex gap-4 text-xs font-semibold">
                <a href="/dashboard" class="text-slate-300 hover:text-teal-400">Dashboard</a>
                <a href="/cases" class="text-slate-300 hover:text-teal-400">Cases</a>
                <a href="/evidence" class="text-teal-400">Evidence Vault</a>
            </div>
            <form th:action="@{/logout}" method="post">
                <button type="submit" class="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-300 text-xs">Logout</button>
            </form>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8 space-y-6">
        <div>
            <h1 class="text-2xl font-bold text-white">Ingest Forensic Evidence Exhibit</h1>
            <p class="text-xs text-slate-400 mt-1">Upload bitstream image, network capture, or volatile RAM payload into secure vault.</p>
        </div>

        <form th:action="@{/evidence/upload}" th:object="${evidenceDto}" method="post" enctype="multipart/form-data"
            class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Target Case Docket</label>
                    <select th:field="*{caseId}" required class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700">
                        <option th:each="c : ${cases}" th:value="${c.id}" th:text="${c.caseNumber + ' - ' + c.caseName}">Case</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Evidence Exhibit Name</label>
                    <input type="text" th:field="*{evidenceName}" required placeholder="e.g. Primary Workstation NVMe Bitstream"
                        class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700 focus:outline-none focus:ring-1 focus:ring-teal-500">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Evidence Type</label>
                    <select th:field="*{evidenceType}" class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700">
                        <option value="DISK_IMAGE">DISK_IMAGE</option>
                        <option value="MEMORY_DUMP">MEMORY_DUMP</option>
                        <option value="NETWORK_PCAP">NETWORK_PCAP</option>
                        <option value="LOG_FILE">LOG_FILE</option>
                        <option value="ENCRYPTED_MEDIA">ENCRYPTED_MEDIA</option>
                        <option value="PHYSICAL_HARDWARE">PHYSICAL_HARDWARE</option>
                        <option value="OTHER">OTHER</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Source Device / Seizure Tag</label>
                    <input type="text" th:field="*{sourceDevice}" placeholder="Lenovo ThinkPad SN#1992"
                        class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700">
                </div>
                <div>
                    <label class="block text-xs font-medium text-slate-400 mb-1">Controlled Storage Locker</label>
                    <input type="text" th:field="*{controlledStorageIdentifier}" required placeholder="SECURE-VAULT-BAY-01"
                        class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2.5 rounded-xl border border-slate-700">
                </div>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Physical Evidence File Upload (Direct Vault Ingestion)</label>
                <input type="file" th:field="*{file}"
                    class="w-full text-xs text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-semibold file:bg-teal-600 file:text-white hover:file:bg-teal-500 cursor-pointer">
                <span class="text-[10px] text-slate-500 block mt-1">Allowed formats: .raw, .dd, .e01, .pcap, .pcapng, .log, .pdf, .enc (Max 500 MB)</span>
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Precomputed SHA-256 Checksum (Optional for physical exhibits)</label>
                <input type="text" th:field="*{precomputedSha256}" placeholder="e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"
                    class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2 rounded-xl border border-slate-700 font-mono">
            </div>

            <div>
                <label class="block text-xs font-medium text-slate-400 mb-1">Description & Acquisition Method</label>
                <textarea th:field="*{description}" rows="2" placeholder="Write-blocker attached, dd command parameters, hash match notes."
                    class="w-full bg-slate-800 text-slate-100 text-xs px-3 py-2 rounded-xl border border-slate-700"></textarea>
            </div>

            <div class="flex justify-end gap-3 pt-2">
                <a href="/evidence" class="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold">Cancel</a>
                <button type="submit" class="px-5 py-2 rounded-xl bg-teal-600 hover:bg-teal-500 text-white font-semibold text-xs tracking-wide shadow">
                    Ingest & Compute Baseline SHA-256
                </button>
            </div>
        </form>
    </main>
</body>
</html>
