# ===================================================================
# Digital Evidence Management & Cyber Crime Investigation System
# Spring Boot 3.x & MySQL 8.x Configuration - EvidentX Security Enclave
# ===================================================================

spring.application.name=digital-forensics-system
server.port=8080

# --- MySQL Database Configuration with Environment Variable Security ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/cyber_forensics_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:rootpassword}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- Hikari Connection Pool Settings ---
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# --- JPA / Hibernate Configuration ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway Database Migrations ---
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# --- File Upload Limits (Forensic disk dumps & evidence captures) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# --- Forensic Storage Vault Repository Path ---
app.forensics.storage.vault-dir=${FORENSICS_VAULT_DIR:/var/forensics/vault/evidence}
app.forensics.hash.algorithm=SHA-256

# --- Secure Session Management & Cookie Hardening ---
server.servlet.session.timeout=15m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.name=EVIDENTX_SESSIONID
server.servlet.session.tracking-modes=cookie

# --- Thymeleaf Configuration ---
spring.thymeleaf.cache=false
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# --- Logging (Never output credentials or stack traces to clients) ---
logging.level.com.college.digitalforensics=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
