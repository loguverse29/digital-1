# ===================================================================
# Test Configuration - In-Memory H2 for Automated Security Tests
# ===================================================================

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false

app.forensics.storage.vault-dir=target/test-vault/evidence
app.forensics.hash.algorithm=SHA-256

logging.level.org.springframework.security=WARN
logging.level.com.college.digitalforensics=INFO
